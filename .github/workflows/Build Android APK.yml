
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Gradle Project
        id: locate
        run: |
          echo "Searching for Gradle settings..."

          find . -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          if [ -f android-app/settings.gradle.kts ]; then
            echo "project_dir=android-app" >> "$GITHUB_OUTPUT"
          elif [ -f android-app/settings.gradle ]; then
            echo "project_dir=android-app" >> "$GITHUB_OUTPUT"
          elif [ -f android-app/app/settings.gradle.kts ]; then
            echo "project_dir=android-app/app" >> "$GITHUB_OUTPUT"
          elif [ -f android-app/app/settings.gradle ]; then
            echo "project_dir=android-app/app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No Gradle settings file found."
            exit 1
          fi

      - name: Show Gradle Configuration
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          echo "Project directory: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) -print

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle Wrapper not found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-With-Mbi-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
