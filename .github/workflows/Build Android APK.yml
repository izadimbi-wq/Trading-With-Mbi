
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Project
        working-directory: android-app
        run: |
          echo "===== ANDROID PROJECT ====="
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \)

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-With-Mbi-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
