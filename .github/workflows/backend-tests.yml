
name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Check Python Syntax
        run: |
          python -m compileall -q backend

      - name: Check Backend Imports
        working-directory: backend/app
        env:
          PYTHONPATH: .
        run: |
          python -c "from main import app; print('Backend import OK:', app.title)"

      - name: Run Unit Tests
        run: |
          python -m pytest -q tests

      - name: Start Backend API
        working-directory: backend/app
        env:
          PYTHONPATH: .
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/backend.log
          exit 1

      - name: Test Live Market Data
        run: |
          echo "===== XAUUSD TICK ====="
          curl -fsS http://127.0.0.1:8000/api/v1/market/XAUUSD/tick

          echo
          echo "===== EURUSD TICK ====="
          curl -fsS http://127.0.0.1:8000/api/v1/market/EURUSD/tick

          echo
          echo "===== XAGUSD TICK ====="
          curl -fsS http://127.0.0.1:8000/api/v1/market/XAGUSD/tick

          echo
          echo "===== XAUUSD 5M CANDLES ====="
          curl -fsS "http://127.0.0.1:8000/api/v1/market/XAUUSD/ohlc?interval=5m&limit=10"
