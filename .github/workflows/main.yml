
name: Extract Trading With Mbi Backend Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Trading-With-Mbi-Backend-Update.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  extract-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify update archive
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Trading-With-Mbi-Backend-Update.zip"
          test -f "$PACKAGE"
          unzip -tq "$PACKAGE"
          unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)backend/'

      - name: Extract backend and tests only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trading-mbi-update
          unzip -q "Trading-With-Mbi-Backend-Update.zip" -d /tmp/trading-mbi-update

          SOURCE="/tmp/trading-mbi-update"
          if [ -d "$SOURCE/Trading-With-Mbi-Backend-Update" ]; then
            SOURCE="$SOURCE/Trading-With-Mbi-Backend-Update"
          fi

          if [ ! -d "$SOURCE/backend" ]; then
            echo "Expected backend directory was not found."
            find /tmp/trading-mbi-update -maxdepth 3 -type d -print
            exit 1
          fi

          mkdir -p backend
          rsync -a "$SOURCE/backend/" backend/

          if [ -d "$SOURCE/tests" ]; then
            mkdir -p tests
            rsync -a "$SOURCE/tests/" tests/
          fi

          echo "Backend extracted. Android assets were not touched."

      - name: Commit backend update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- backend

          if [ -d tests ]; then
            git add -A -- tests
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Apply Trading With Mbi backend update"
            git push
          else
            echo "No backend changes to commit."
          fi
