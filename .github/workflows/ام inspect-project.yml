
name: Inspect Android Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show extracted project structure
        run: |
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== PROJECT FILES ====="
          find . -maxdepth 5 -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \
            -o -name "package.json" \
            -o -name "pubspec.yaml" \) \
            -print
                      echo "===== ANDROID APP FILES ====="
          find android-app -maxdepth 4 -type f | sort

          echo "===== SETTINGS GRADLE ====="
          cat android-app/settings.gradle.kts

          echo "===== ROOT BUILD GRADLE ====="
          cat android-app/build.gradle.kts

          echo "===== APP BUILD GRADLE ====="
          cat android-app/app/build.gradle.kts

          echo "===== GRADLE WRAPPER CHECK ====="
          ls -la android-app/gradle/wrapper/ 2>/dev/null || true
